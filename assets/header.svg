<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="esuhdev, Java developer and founder of Corevia Bilişim">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="320" rx="16"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, 'Liberation Mono', monospace; }
      .cell { fill: #161b22; stroke: #21262d; stroke-width: 1; }
      .on   { animation: pulse 4.8s ease-in-out infinite; }
      .b { fill: #1f6feb; } .b2 { fill: #388bfd; } .g { fill: #2ea043; } .g2 { fill: #3fb950; }
      @keyframes pulse { 0%, 100% { opacity: .18; } 45%, 60% { opacity: 1; } }
      .d1 { animation-delay: .0s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; }
      .d4 { animation-delay: 1.8s; } .d5 { animation-delay: 2.4s; } .d6 { animation-delay: 3.0s; }
      .d7 { animation-delay: 3.6s; } .d8 { animation-delay: 4.2s; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .on, .blink { animation: none; opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#0d1117"/>
    <rect width="1280" height="320" fill="url(#dots)"/>

    <!-- region grid -->
    <g transform="translate(836 52)">
      <g>
        <rect class="cell" x="0"   y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="48"  y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="96"  y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="144" y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="192" y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="240" y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="288" y="0" width="40" height="40" rx="6"/>
        <rect class="cell" x="336" y="0" width="40" height="40" rx="6"/>

        <rect class="cell" x="0"   y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="48"  y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="96"  y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="144" y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="192" y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="240" y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="288" y="48" width="40" height="40" rx="6"/>
        <rect class="cell" x="336" y="48" width="40" height="40" rx="6"/>

        <rect class="cell" x="0"   y="96" width="40" height="40" rx="6"/>
        <rect class="cell" x="48"  y="96" width="40" height="40" rx="6"/>
        <rect class="cell" x="96"  y="96" width="40" height="40" rx="6"/>
        <rect class="cell" x="144" y="96" width="40" height="40" rx="6"/>
        <rect class="cell" x="192" y="96" width="40" height="40" rx="6"/>
        <rect class="cell" x="240" y="96" width="40" height="40" rx="6"/>
        <rect class="cell" x="288" y="96" width="40" height="40" rx="6"/>
        <rect class="cell" x="336" y="96" width="40" height="40" rx="6"/>

        <rect class="cell" x="0"   y="144" width="40" height="40" rx="6"/>
        <rect class="cell" x="48"  y="144" width="40" height="40" rx="6"/>
        <rect class="cell" x="96"  y="144" width="40" height="40" rx="6"/>
        <rect class="cell" x="144" y="144" width="40" height="40" rx="6"/>
        <rect class="cell" x="192" y="144" width="40" height="40" rx="6"/>
        <rect class="cell" x="240" y="144" width="40" height="40" rx="6"/>
        <rect class="cell" x="288" y="144" width="40" height="40" rx="6"/>
        <rect class="cell" x="336" y="144" width="40" height="40" rx="6"/>
      </g>
      <!-- active regions -->
      <rect class="on b  d1" x="48"  y="0"   width="40" height="40" rx="6"/>
      <rect class="on b2 d1" x="96"  y="0"   width="40" height="40" rx="6"/>
      <rect class="on b2 d1" x="48"  y="48"  width="40" height="40" rx="6"/>
      <rect class="on g  d3" x="240" y="0"   width="40" height="40" rx="6"/>
      <rect class="on g2 d3" x="288" y="48"  width="40" height="40" rx="6"/>
      <rect class="on g  d3" x="240" y="48"  width="40" height="40" rx="6"/>
      <rect class="on b  d5" x="144" y="96"  width="40" height="40" rx="6"/>
      <rect class="on b2 d5" x="192" y="96"  width="40" height="40" rx="6"/>
      <rect class="on g2 d7" x="0"   y="144" width="40" height="40" rx="6"/>
      <rect class="on g  d7" x="48"  y="144" width="40" height="40" rx="6"/>
      <rect class="on b2 d6" x="336" y="144" width="40" height="40" rx="6"/>
      <rect class="on b  d6" x="288" y="144" width="40" height="40" rx="6"/>
      <rect class="on g2 d2" x="336" y="96"  width="40" height="40" rx="6"/>
      <rect class="on b  d8" x="96"  y="96"  width="40" height="40" rx="6"/>
      <rect class="on g  d4" x="192" y="0"   width="40" height="40" rx="6"/>

      <text class="mono" x="0" y="222" font-size="14" fill="#7d8590">regions ticking in parallel</text>
      <text class="mono" x="376" y="222" font-size="14" fill="#7d8590" text-anchor="end">folia</text>
    </g>

    <!-- fade so the text side stays clean -->
    <rect width="900" height="320" fill="url(#fade)"/>

    <!-- text -->
    <g transform="translate(64 0)">
      <text class="mono" x="0" y="78" font-size="16" fill="#7d8590">
        <tspan fill="#3fb950">$</tspan> whoami<tspan class="blink" fill="#c9d1d9"> _</tspan>
      </text>
      <text class="sans" x="-3" y="148" font-size="68" font-weight="700" fill="#f0f6fc" letter-spacing="-1.5">esuhdev</text>
      <rect x="0" y="166" width="72" height="4" rx="2" fill="url(#accent)"/>
      <text class="sans" x="0" y="206" font-size="24" fill="#c9d1d9">Java Developer · Founder of Corevia Bilişim</text>

      <g class="mono" font-size="14">
        <rect x="0"   y="234" width="78"  height="32" rx="16" fill="#0f2a1a" stroke="#238636"/>
        <text x="39"  y="255" fill="#3fb950" text-anchor="middle">Folia</text>
        <rect x="88"  y="234" width="78"  height="32" rx="16" fill="#0c2240" stroke="#1f6feb"/>
        <text x="127" y="255" fill="#79c0ff" text-anchor="middle">Paper</text>
        <rect x="176" y="234" width="164" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
        <text x="258" y="255" fill="#c9d1d9" text-anchor="middle">Backend systems</text>
        <rect x="350" y="234" width="150" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
        <text x="425" y="255" fill="#c9d1d9" text-anchor="middle">Istanbul, TR</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="15.5" fill="none" stroke="#30363d"/>
</svg>
